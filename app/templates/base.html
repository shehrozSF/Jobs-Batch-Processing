<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Batch extraction{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }
    a { color: #0969da; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #d0d7de; }
    .bar { background: #eaeef2; border-radius: 4px; height: 14px; overflow: hidden; }
    .bar > div { background: #2da44e; height: 100%; }
    .alert { background: #fff8c5; border: 1px solid #d4a72c; padding: .6rem .8rem; border-radius: 6px; }
    button { padding: .4rem .9rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1><a href="/" style="color:inherit;text-decoration:none">Batch extraction</a></h1>
  {% block content %}{% endblock %}
</body>
</html>
